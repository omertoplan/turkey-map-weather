name: Build Weather Map Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build standalone mobile bundle (dist/mobile)
        run: bun run build:mobile

      - name: Assert bundle is standalone
        run: |
          test -f dist/mobile/index.html
          if grep -rq "lovable.app" dist/mobile; then
            echo "dist/mobile still references lovable.app" >&2
            exit 1
          fi

      - name: Create Android project
        run: bunx cap add android

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '<application'
          permissions = '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Weather Map icon
        run: |
          test -f public/app-icon.png
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert public/app-icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert public/app-icon.png -resize "${size}x${size}" "$dir/ic_launcher_round.png"
          done

      - name: Sync Capacitor (copies dist/mobile into the APK assets)
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
